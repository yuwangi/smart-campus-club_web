<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - 智能社团活动管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-box-seam-fill me-2 text-gradient"></i>智能社团活动管理系统
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="navAuthSection">
                <!-- Content will be injected by JS -->
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-container">
            <!-- Sidebar -->
            <aside class="modern-sidebar d-none d-lg-block">
                <h6 class="text-uppercase text-muted fw-bold small px-3 mb-3">Menu</h6>
                <div class="nav flex-column nav-pills-modern">
                    <a class="nav-link" href="profile.html"><i class="bi bi-person me-3 fs-5"></i>个人资料</a>
                    <a class="nav-link" href="publish.html"><i class="bi bi-pencil-square me-3 fs-5"></i>发布活动</a>
                    <a class="nav-link active" href="history.html"><i class="bi bi-clock-history me-3 fs-5"></i>历史记录</a>
                    <a class="nav-link" href="recommend.html"><i class="bi bi-stars me-3 fs-5"></i>为您推荐</a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">参与历史</h2>
                </div>
                
                <div class="content-card">
                    <!-- History Item 1 -->
                    <div class="d-flex gap-3 align-items-center p-3 border-bottom">
                         <div class="rounded-3 bg-light p-3 text-center" style="width: 80px;">
                            <span class="d-block fw-bold text-primary">20</span>
                            <span class="d-block text-muted small">10月</span>
                        </div>
                        <div class="flex-grow-1">
                            <h5 class="fw-bold mb-1">校园十佳歌手大赛</h5>
                            <p class="text-muted mb-0 small"><i class="bi bi-geo-alt me-1"></i> 大礼堂 • 已结束</p>
                        </div>
                        <a href="activity.html?id=music" class="btn btn-sm btn-outline-primary rounded-pill">查看详情</a>
                    </div>

                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth()) return;
            renderNavbar(true);
            updateUsernameDisplay();
        });
    </script>
</body>
</html>
