<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - 智能社团活动管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-box-seam-fill me-2 text-gradient"></i>智能社团活动管理系统
            </a>
            <div class="dropdown" id="navAuthSection">
                <a class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark fw-bold" href="#" data-bs-toggle="dropdown">
                    <img src="https://placehold.co/100x100" class="rounded-circle border border-2 border-primary me-2" width="36" height="36" alt="Avatar">
                    <span id="navUsernameDisplay">Student</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg rounded-4 mt-2">
                    <li><a class="dropdown-item py-2" href="profile.html"><i class="bi bi-person me-2 text-muted"></i>个人中心</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item py-2 text-danger" href="#" onclick="handleLogout(event)"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="dashboard-container">
            <!-- Sidebar -->
            <aside class="modern-sidebar d-none d-lg-block">
                <h6 class="text-uppercase text-muted fw-bold small px-3 mb-3">Menu</h6>
                <div class="nav flex-column nav-pills-modern">
                    <a class="nav-link" href="profile.html"><i class="bi bi-person me-3 fs-5"></i>个人资料</a>
                    <a class="nav-link" href="publish.html"><i class="bi bi-pencil-square me-3 fs-5"></i>发布活动</a>
                    <a class="nav-link active" href="history.html"><i class="bi bi-clock-history me-3 fs-5"></i>历史记录</a>
                    <a class="nav-link" href="recommend.html"><i class="bi bi-stars me-3 fs-5"></i>为您推荐</a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">参与历史</h2>
                </div>
                
                <div class="content-card">
                    <!-- History Item 1 -->
                    <div class="d-flex gap-3 align-items-center p-3 border-bottom">
                         <div class="rounded-3 bg-light p-3 text-center" style="width: 80px;">
                            <span class="d-block fw-bold text-primary">20</span>
                            <span class="d-block text-muted small">10月</span>
                        </div>
                        <div class="flex-grow-1">
                            <h5 class="fw-bold mb-1">校园十佳歌手大赛</h5>
                            <p class="text-muted mb-0 small"><i class="bi bi-geo-alt me-1"></i> 大礼堂 • 已结束</p>
                        </div>
                        <a href="activity.html?id=music" class="btn btn-sm btn-outline-primary rounded-pill">查看详情</a>
                    </div>

                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const username = localStorage.getItem('username') || 'Student';
            const display = document.getElementById('navUsernameDisplay');
            if (display) display.innerText = username;
        });

        function handleLogout(e) {
            e.preventDefault();
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
