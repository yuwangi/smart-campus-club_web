<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 智能社团活动管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Premium Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-box-seam-fill me-2 text-gradient"></i>智能社团活动管理系统
            </a>
            <div class="dropdown" id="navAuthSection">
                <a class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark fw-bold" href="#" data-bs-toggle="dropdown">
                    <img src="https://placehold.co/100x100" class="rounded-circle border border-2 border-primary me-2" width="36" height="36" alt="Avatar">
                    <span id="navUsernameDisplay">Student</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg rounded-4 mt-2">
                    <li><a class="dropdown-item py-2" href="#"><i class="bi bi-gear me-2 text-muted"></i>设置</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item py-2 text-danger" href="#" onclick="handleLogout(event)"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="dashboard-container">
            <!-- Modern Sidebar -->
            <aside class="modern-sidebar d-none d-lg-block">
                <h6 class="text-uppercase text-muted fw-bold small px-3 mb-3">Menu</h6>
                <div class="nav flex-column nav-pills-modern">
                    <a class="nav-link active" href="profile.html"><i class="bi bi-person me-3 fs-5"></i>个人资料</a>
                    <a class="nav-link" href="publish.html"><i class="bi bi-pencil-square me-3 fs-5"></i>发布活动</a>
                    <a class="nav-link" href="history.html"><i class="bi bi-clock-history me-3 fs-5"></i>历史记录</a>
                    <a class="nav-link" href="recommend.html"><i class="bi bi-stars me-3 fs-5"></i>为您推荐</a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">个人资料</h2>
                    <button class="btn btn-outline-primary rounded-pill d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">
                        <i class="bi bi-list"></i> 菜单
                    </button>
                </div>
                
                <div class="content-card">
                    <form onsubmit="handleSave(event)">
                        <!-- Avatar Section -->
                        <div class="d-flex align-items-center gap-4 mb-5">
                            <div class="position-relative">
                                <img src="https://placehold.co/150x150" id="avatarPreview" class="rounded-circle shadow" width="100" height="100" style="object-fit: cover;" alt="Avatar">
                                <button type="button" class="btn btn-primary btn-sm rounded-circle position-absolute bottom-0 end-0 border-2 border-white" onclick="document.getElementById('avatarFile').click()">
                                    <i class="bi bi-camera"></i>
                                </button>
                                <input type="file" id="avatarFile" class="d-none" accept="image/*" onchange="previewAvatar(this)">
                            </div>
                            <div>
                                <h4 class="fw-bold mb-1">张三</h4>
                                <p class="text-muted mb-0">更新您的头像和个人信息</p>
                            </div>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control bg-light border-0 rounded-3" id="username" value="zhangsan" readonly>
                                    <label for="username">用户名 (不可修改)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control border-light shadow-sm rounded-3" id="nickname" value="小张">
                                    <label for="nickname">昵称</label>
                                </div>
                            </div>
                            <!-- More fields -->
                             <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control border-light shadow-sm rounded-3" id="realname" value="张三">
                                    <label for="realname">真实姓名</label>
                                </div>
                            </div>
                             <div class="col-md-6">
                                <div class="form-floating">
                                    <select class="form-select border-light shadow-sm rounded-3" id="gender">
                                        <option value="male" selected>男</option>
                                        <option value="female">女</option>
                                    </select>
                                    <label for="gender">性别</label>
                                </div>
                            </div>
                             <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="date" class="form-control border-light shadow-sm rounded-3" id="birthday" value="2000-01-01">
                                    <label for="birthday">生日</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="tel" class="form-control border-light shadow-sm rounded-3" id="phone" value="13800138000">
                                    <label for="phone">手机号码</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="email" class="form-control border-light shadow-sm rounded-3" id="email" value="zhangsan@example.com">
                                    <label for="email">邮箱</label>
                                </div>
                            </div>
                             <div class="col-md-12">
                                <div class="form-floating">
                                    <input type="text" class="form-control border-light shadow-sm rounded-3" id="hobbies" value="运动 读书 旅游">
                                    <label for="hobbies">兴趣爱好</label>
                                </div>
                            </div>
                        </div>

                        <div class="bg-light p-4 rounded-4 mb-4">
                            <h5 class="fw-bold mb-3"><i class="bi bi-shield-lock me-2"></i>安全设置</h5>
                             <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="password" class="form-control border-0 rounded-3" id="password" placeholder="New Password">
                                        <label for="password">新密码 (如不修改请留空)</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="password" class="form-control border-0 rounded-3" id="confirmPassword" placeholder="Confirm Password">
                                        <label for="confirmPassword">确认新密码</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary-gradient px-5 py-2 fs-6">
                                保存修改
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
    
     <!-- Offcanvas for Mobile Sidebar -->
    <div class="offcanvas offcanvas-start rounded-end-4" tabindex="-1" id="sidebarOffcanvas">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title fw-bold">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
             <div class="nav flex-column nav-pills-modern">
                <a class="nav-link active" href="profile.html"><i class="bi bi-person me-3 fs-5"></i>个人资料</a>
                <a class="nav-link" href="publish.html"><i class="bi bi-pencil-square me-3 fs-5"></i>发布活动</a>
                <a class="nav-link" href="history.html"><i class="bi bi-clock-history me-3 fs-5"></i>历史记录</a>
                <a class="nav-link" href="recommend.html"><i class="bi bi-stars me-3 fs-5"></i>为您推荐</a>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const username = localStorage.getItem('username') || 'Student';
            document.getElementById('navUsernameDisplay').innerText = username;
            if (document.getElementById('username') && document.getElementById('username').tagName === 'INPUT') {
                document.getElementById('username').value = username;
            }
        });

        function handleLogout(e) {
            e.preventDefault();
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');
            window.location.href = 'login.html';
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `custom-toast toast-${type}`;
            toast.innerHTML = `
                <i class="bi bi-${type === 'success' ? 'check-circle-fill' : type === 'error' ? 'x-circle-fill' : 'info-circle-fill'} fs-5" 
                   style="color: var(--${type === 'success' ? 'success' : type === 'error' ? 'danger' : 'info'}-color)"></i>
                <span class="toast-message">${message}</span>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateX(0)';
            }, 10);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function handleSave(event) {
            event.preventDefault();
            // 保存兴趣爱好到 localStorage
            const hobbiesInput = document.getElementById('hobbies');
            if (hobbiesInput) {
                localStorage.setItem('hobbies', hobbiesInput.value);
            }
            showToast("个人资料更新成功！", "success");
        }

        function previewAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarPreview').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
