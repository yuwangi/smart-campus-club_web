<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布活动 - 智能社团活动管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Premium Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-box-seam-fill me-2 text-gradient"></i>智能社团活动管理系统
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto align-items-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link fw-medium" href="index.html"><i class="bi bi-house-door me-1"></i>首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-medium" href="recommend.html"><i class="bi bi-stars me-1"></i>活动推荐</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-medium" href="publish.html"><i class="bi bi-pencil-square me-1"></i>发布活动</a>
                    </li>
                </ul>
                <ul class="navbar-nav align-items-center gap-3" id="navAuthSection">
                    <li class="nav-item">
                        <a class="btn btn-primary-gradient rounded-pill" href="login.html">登录 / 注册</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="dashboard-container">
            <!-- Modern Sidebar -->
             <aside class="modern-sidebar d-none d-lg-block">
                <h6 class="text-uppercase text-muted fw-bold small px-3 mb-3">Menu</h6>
                <div class="nav flex-column nav-pills-modern">
                    <a class="nav-link" href="profile.html"><i class="bi bi-person me-3 fs-5"></i>个人资料</a>
                    <a class="nav-link active" href="publish.html"><i class="bi bi-pencil-square me-3 fs-5"></i>发布活动</a>
                    <a class="nav-link" href="history.html"><i class="bi bi-clock-history me-3 fs-5"></i>历史记录</a>
                    <a class="nav-link" href="recommend.html"><i class="bi bi-stars me-3 fs-5"></i>为您推荐</a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">发布新活动</h2>
                </div>
                
                <div class="content-card">
                    <form onsubmit="handlePublish(event)">
                        <div class="form-floating mb-4">
                            <input type="text" class="form-control border-light shadow-sm rounded-3 fw-bold fs-5" id="title" placeholder="Title" required>
                            <label for="title">活动标题</label>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label for="content" class="form-label text-muted fw-bold small text-uppercase">Activity Content</label>
                                <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="aiGenerateContent()">
                                    <i class="bi bi-stars me-1"></i> AI 智能生成
                                </button>
                            </div>
                            <textarea class="form-control border-light shadow-sm rounded-3" id="content" rows="6" placeholder="输入活动详情，或点击上方按钮智能生成..."></textarea>
                        </div>

                        <div class="bg-light p-4 rounded-4 mb-4">
                            <label class="form-label text-muted fw-bold small text-uppercase mb-3">Cover Image</label>
                            
                            <div class="btn-group w-100 mb-3" role="group">
                                <input type="radio" class="btn-check" name="posterType" id="localUpload" autocomplete="off" checked onclick="togglePosterInput('local')">
                                <label class="btn btn-outline-white bg-white text-dark shadow-sm border-0 py-2" for="localUpload"><i class="bi bi-upload me-2"></i>本地上传</label>

                                <input type="radio" class="btn-check" name="posterType" id="aiGenerate" autocomplete="off" onclick="togglePosterInput('ai')">
                                <label class="btn btn-outline-white bg-white text-dark shadow-sm border-0 py-2" for="aiGenerate"><i class="bi bi-magic me-2"></i>AI 创意生成</label>
                            </div>

                            <div id="localInputArea">
                                <div class="border-2 border-dashed border-secondary border-opacity-25 rounded-3 p-5 text-center bg-white" 
                                     onclick="document.getElementById('posterFile').click()" style="cursor: pointer;">
                                    <i class="bi bi-cloud-upload fs-1 text-muted mb-3 d-block"></i>
                                    <p class="mb-0 text-muted">点击选择或拖拽图片到此处</p>
                                    <input type="file" class="d-none" id="posterFile" accept="image/*" onchange="previewImage(this)">
                                </div>
                                <div class="mt-3 text-center" id="previewContainer" style="display:none;">
                                    <img id="posterPreview" src="" alt="Poster Preview" class="img-fluid rounded-3 shadow-sm" style="max-height: 300px; object-fit: cover;">
                                </div>
                            </div>

                            <div id="aiInputArea" style="display:none;">
                                <div class="text-center py-5 bg-white rounded-3 shadow-sm">
                                    <div class="mb-3">
                                        <i class="bi bi-palette fs-1 text-primary-gradient"></i>
                                    </div>
                                    <h5 class="fw-bold">AI 创意工坊</h5>
                                    <p class="text-muted mb-4">根据您的活动主题，自动生成独一无二的海报</p>
                                    <button type="button" class="btn btn-primary-gradient rounded-pill px-4" onclick="aiGeneratePoster()">
                                        <i class="bi bi-play-fill me-1"></i> 开始生成
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-12">
                                <div class="form-floating">
                                    <input type="text" class="form-control border-light shadow-sm rounded-3" id="tags" placeholder="Tags">
                                    <label for="tags"><i class="bi bi-tags me-2"></i>活动标签 (以空格分隔)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="datetime-local" class="form-control border-light shadow-sm rounded-3" id="startTime">
                                    <label for="startTime">开始时间</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="datetime-local" class="form-control border-light shadow-sm rounded-3" id="endTime">
                                    <label for="endTime">结束时间</label>
                                </div>
                            </div>
                        </div>
                        
                         <div class="form-floating mb-4">
                            <textarea class="form-control border-light shadow-sm rounded-3" id="remark" placeholder="备注" style="height: 100px;"></textarea>
                            <label for="remark">备注信息</label>
                        </div>

                        <div class="d-flex justify-content-end gap-3 border-top pt-4">
                            <button type="button" class="btn btn-light rounded-pill px-4">取消</button>
                            <button type="submit" class="btn btn-primary-gradient rounded-pill px-5 shadow-lg">
                                立即发布 <i class="bi bi-send-fill ms-2"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Offcanvas -->
    <div class="offcanvas offcanvas-start rounded-end-4" tabindex="-1" id="sidebarOffcanvas">...</div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 鉴权拦截：未登录用户重定向到登录页
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (!isLoggedIn) {
                window.location.href = 'login.html';
                return;
            }

            const username = localStorage.getItem('username') || 'Student';
            const navAuthSection = document.getElementById('navAuthSection');

            // 更新导航栏为用户头像下拉菜单
            navAuthSection.innerHTML = `
                <div class="dropdown">
                    <a class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark fw-bold" href="#" data-bs-toggle="dropdown">
                        <img src="https://placehold.co/100x100" class="rounded-circle border border-2 border-primary me-2" width="36" height="36" alt="Avatar">
                        <span>${username}</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg rounded-4 mt-2">
                        <li><a class="dropdown-item py-2" href="profile.html"><i class="bi bi-person me-2 text-muted"></i>个人中心</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item py-2 text-danger" href="#" onclick="handleLogout(event)"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
                    </ul>
                </div>
            `;
        });

        function handleLogout(e) {
            e.preventDefault();
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');
            window.location.href = 'index.html';
        }

        function togglePosterInput(type) {
            const localArea = document.getElementById('localInputArea');
            const aiArea = document.getElementById('aiInputArea');
            
            if (type === 'local') {
                localArea.style.display = 'block';
                aiArea.style.display = 'none';
            } else {
                localArea.style.display = 'none';
                aiArea.style.display = 'block';
                showToast("已切换至 AI 海报生成模式", "info");
            }
        }

        function previewImage(input) {
            const container = document.getElementById('previewContainer');
            const preview = document.getElementById('posterPreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    container.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            } else {
                 container.style.display = 'none';
            }
        }

        function aiGenerateContent() {
            const contentBox = document.getElementById('content');
            contentBox.value = "正在生成中...";
            showToast("AI 正在思考创意文案...", "info");
            setTimeout(() => {
                contentBox.value = "【重磅来袭】这是一场不容错过的精彩活动！\n\n我们将带您体验前所未有的视听盛宴，更有神秘嘉宾到场助阵。在这里，您可以结识志同道合的朋友，拓展视野，丰富校园生活。\n\n赶快报名加入我们吧！";
                showToast("文案生成成功！", "success");
            }, 1500);
        }

        function aiGeneratePoster() {
             showToast("正在请求 AI 绘图引擎...", "info");
             setTimeout(() => {
                showToast("AI 海报生成成功！(演示)", "success");
            }, 2000);
        }

        function handlePublish(e) {
            e.preventDefault();
            showToast("活动发布成功！正在跳转...", "success");
             setTimeout(() => {
                window.location.href = 'history.html';
            }, 1500);
        }
    </script>
</body>
</html>
