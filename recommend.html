<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动推荐 - 智能社团活动管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-box-seam-fill me-2 text-gradient"></i>智能社团活动管理系统
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="navAuthSection">
                <!-- Content will be injected by JS -->
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-container">
            <!-- Sidebar -->
            <aside class="modern-sidebar d-none d-lg-block">
                <h6 class="text-uppercase text-muted fw-bold small px-3 mb-3">Menu</h6>
                <div class="nav flex-column nav-pills-modern">
                    <a class="nav-link" href="profile.html"><i class="bi bi-person me-3 fs-5"></i>个人资料</a>
                    <a class="nav-link" href="publish.html"><i class="bi bi-pencil-square me-3 fs-5"></i>发布活动</a>
                    <a class="nav-link" href="history.html"><i class="bi bi-clock-history me-3 fs-5"></i>历史记录</a>
                    <a class="nav-link active" href="recommend.html"><i class="bi bi-stars me-3 fs-5"></i>为您推荐</a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">为您推荐</h2>
                    <p class="text-muted mb-0">根据您的兴趣 [运动, 读书] 生成</p>
                </div>
                
                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 row-gap-5">
                    <!-- Premium Card 1 -->
                    <div class="col">
                        <a href="activity.html?id=music" class="text-decoration-none">
                            <div class="card-premium">
                                <div class="card-img-wrapper">
                                    <img src="images/activity_music.png" alt="Cover">
                                    <div class="card-overlay">
                                        <span class="card-tag">音乐</span>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <h3 class="premium-title">校园十佳歌手大赛</h3>
                                    <div class="premium-info">
                                        <span><i class="bi bi-calendar4 me-1"></i> 10月20日 18:00 - 21:00</span>
                                        <span><i class="bi bi-geo-alt me-1"></i> 大礼堂</span>
                                    </div>
                                    <div class="d-flex align-items-center justify-content-between mt-4">
                                        <div class="d-flex align-items-center">
                                            <div class="bg-light rounded-circle p-1 border border-white position-relative" style="width:30px;height:30px; margin-right: -10px;"></div>
                                            <div class="bg-secondary rounded-circle p-1 border border-white position-relative" style="width:30px;height:30px; margin-right: -10px;"></div>
                                            <small class="ms-4 text-muted text-xs">300+ 已报名</small>
                                        </div>
                                        <span class="text-primary fw-bold small">查看详情</span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>

                    <!-- Premium Card 2 -->
                    <div class="col">
                        <a href="activity.html?id=tech" class="text-decoration-none">
                            <div class="card-premium">
                                <div class="card-img-wrapper">
                                    <img src="images/activity_tech.png" alt="Cover">
                                    <div class="card-overlay">
                                        <span class="card-tag">科技</span>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <h3 class="premium-title">人工智能前沿论坛</h3>
                                    <div class="premium-info">
                                        <span><i class="bi bi-calendar4 me-1"></i> 11月05日 14:00 - 17:00</span>
                                        <span><i class="bi bi-geo-alt me-1"></i> 学术报告厅</span>
                                    </div>
                                    <div class="d-flex align-items-center justify-content-between mt-4">
                                        <span class="badge bg-light text-dark border">校级活动</span>
                                        <span class="text-primary fw-bold small">查看详情</span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>

                    <!-- Premium Card 3 -->
                    <div class="col">
                        <a href="activity.html?id=reading" class="text-decoration-none">
                            <div class="card-premium">
                                <div class="card-img-wrapper">
                                    <img src="images/activity_reading.png" alt="Cover">
                                     <div class="card-overlay">
                                        <span class="card-tag">阅读</span>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <h3 class="premium-title">周末沉浸式读书会</h3>
                                    <div class="premium-info">
                                        <span><i class="bi bi-calendar4 me-1"></i> 11月12日 09:00 - 11:30</span>
                                        <span><i class="bi bi-geo-alt me-1"></i> 图书馆</span>
                                    </div>
                                     <div class="d-flex align-items-center justify-content-between mt-4">
                                         <small class="text-muted">限额 50 人</small>
                                        <span class="text-primary fw-bold small">查看详情</span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                     <!-- Premium Card 4 -->
                     <div class="col">
                        <a href="activity.html?id=outdoor" class="text-decoration-none">
                            <div class="card-premium">
                                <div class="card-img-wrapper">
                                    <img src="images/activity_outdoor.png" alt="Cover">
                                     <div class="card-overlay">
                                        <span class="card-tag">户外</span>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <h3 class="premium-title">森林公园徒步挑战</h3>
                                    <div class="premium-info">
                                        <span><i class="bi bi-calendar4 me-1"></i> 11月15日 08:00 - 16:00</span>
                                        <span><i class="bi bi-geo-alt me-1"></i> 森林公园</span>
                                    </div>
                                     <div class="d-flex align-items-center justify-content-between mt-4">
                                         <small class="text-muted">需自备装备</small>
                                        <span class="text-primary fw-bold small">查看详情</span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth()) return;
            renderNavbar(true);
            updateUsernameDisplay();
        });
    </script>
</body>
</html>
