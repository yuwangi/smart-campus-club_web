<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 智能社团活动管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div class="container-fluid p-0">
        <div class="auth-premium-layout">
            <!-- Left Side: Visual (Different BG for Register) -->
            <div class="auth-sidebar-premium d-none d-lg-flex" style="background-image: url('https://placehold.co/800x1200/db2777/ffffff?text=Community');">
                <div class="glass-card text-center">
                    <h2 class="display-4 fw-bold mb-4">加入我们</h2>
                    <p class="lead mb-4">开启您的社团探索之旅。无论是组织者还是参与者，这里都有属于您的舞台。</p>
                    <ul class="list-unstyled text-start d-inline-block mx-auto">
                        <li class="mb-3"><i class="bi bi-check-circle-fill text-info me-2"></i> 实时获取最新活动资讯</li>
                        <li class="mb-3"><i class="bi bi-check-circle-fill text-info me-2"></i> 智能推荐感兴趣的内容</li>
                        <li class="mb-3"><i class="bi bi-check-circle-fill text-info me-2"></i> 便捷的活动报名管理</li>
                    </ul>
                </div>
            </div>

            <!-- Right Side: Form -->
            <div class="auth-content-container">
                <div class="p-5 w-100 fade-in-up" style="max-width: 480px;">
                    <div class="text-center mb-5">
                        <h3 class="fw-bold fs-2 mb-2 text-dark">创建新账号</h3>
                        <p class="text-muted">填写以下信息完成注册</p>
                    </div>

                    <form id="registForm" onsubmit="handleRegist(event)">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control rounded-4 bg-light border-0" id="username" placeholder="用户名" required>
                            <label for="username" class="text-muted">用户名</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control rounded-4 bg-light border-0" id="password" placeholder="密码" required>
                            <label for="password" class="text-muted">密码</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control rounded-4 bg-light border-0" id="confirmInfo" placeholder="确认密码" required>
                            <label for="confirmInfo" class="text-muted">确认密码</label>
                        </div>

                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary-gradient py-3 fs-6">
                                立即注册 <i class="bi bi-person-plus-fill ms-2"></i>
                            </button>
                        </div>
                    </form>

                    <div class="text-center">
                        <span class="text-muted small">已有账号？</span>
                        <a href="login.html" class="text-decoration-none fw-bold text-primary ms-1">立即登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `custom-toast toast-${type}`;
            toast.innerHTML = `
                <i class="bi bi-${type === 'success' ? 'check-circle-fill' : type === 'error' ? 'x-circle-fill' : 'info-circle-fill'} fs-5" 
                   style="color: var(--${type === 'success' ? 'success' : type === 'error' ? 'danger' : 'info'}-color)"></i>
                <span class="toast-message">${message}</span>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateX(0)';
            }, 10);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function handleRegist(event) {
            event.preventDefault();
            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('confirmInfo').value;

            if(p1 !== p2) {
                showToast('两次输入的密码不一致', 'error');
                return;
            }

            showToast('注册成功！', 'success');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }
    </script>
</body>
</html>
