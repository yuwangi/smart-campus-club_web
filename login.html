<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智能社团活动管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div class="container-fluid p-0">
        <div class="auth-premium-layout">
            <!-- Left Side: Visual -->
            <div class="auth-sidebar-premium d-none d-lg-flex">
                <div class="glass-card text-center">
                    <h2 class="display-4 fw-bold mb-4">欢迎回来</h2>
                    <p class="lead mb-4">加入数千名同学的行列，发现校园中最有趣的活动。与志同道合的朋友一起，创造难忘的回忆。</p>
                    <div class="d-flex justify-content-center gap-3">
                        <div class="bg-white bg-opacity-25 rounded-circle circle-icon">
                            <i class="bi bi-music-note-beamed fs-3"></i>
                        </div>
                        <div class="bg-white bg-opacity-25 rounded-circle circle-icon">
                            <i class="bi bi-camera-fill fs-3"></i>
                        </div>
                        <div class="bg-white bg-opacity-25 rounded-circle circle-icon">
                            <i class="bi bi-controller fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Form -->
            <div class="auth-content-container">
                <div class="p-5 w-100 fade-in-up" style="max-width: 480px;">
                    <div class="text-center mb-5">
                        <h3 class="fw-bold fs-2 mb-2 text-dark">账号登录</h3>
                        <p class="text-muted">请输入您的账户信息以继续</p>
                    </div>

                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control rounded-4 bg-light border-0" id="username" placeholder="用户名" required>
                            <label for="username" class="text-muted">用户名</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control rounded-4 bg-light border-0" id="password" placeholder="密码" required>
                            <label for="password" class="text-muted">密码</label>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small text-muted" for="rememberMe">
                                    记住我
                                </label>
                            </div>
                            
                        </div>

                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary-gradient py-3 fs-6">
                                立即登录 <i class="bi bi-arrow-right ms-2"></i>
                            </button>
                        </div>
                    </form>

                    <div class="text-center">
                        <span class="text-muted small">还没有账号？</span>
                        <a href="regist.html" class="text-decoration-none fw-bold text-primary ms-1">立即注册</a>
                    </div>
                     <div class="text-center mt-4">
                        <a href="index.html" class="text-decoration-none small text-muted">
                            <i class="bi bi-arrow-left me-1"></i> 返回首页
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `custom-toast toast-${type}`;
            toast.innerHTML = `
                <i class="bi bi-${type === 'success' ? 'check-circle-fill' : type === 'error' ? 'x-circle-fill' : 'info-circle-fill'} fs-5" 
                   style="color: var(--${type === 'success' ? 'success' : type === 'error' ? 'danger' : 'info'}-color)"></i>
                <span class="toast-message">${message}</span>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateX(0)';
            }, 10);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function handleLogin(event) {
            event.preventDefault();
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('username', document.getElementById('username').value || 'Student');
            showToast('登录成功！正在跳转...', 'success');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        }
    </script>
</body>
</html>
